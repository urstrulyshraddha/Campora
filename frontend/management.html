<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Resolver & Management Portal | Campora</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="css/style.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            pastel: {
              bg: '#f8f7fc',
              surface: '#ffffff',
              border: '#e9e4f5',
              subtle: '#f3f0fa',
              text: '#1e1b4b',
              purple: '#7c3aed',
              purpleHover: '#6d28d9',
              purpleLight: '#ede9fe'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-purple-200 selection:text-purple-900">

  <!-- Header -->
  <header class="border-b border-pastel-border bg-white/80 sticky top-0 z-30 backdrop-blur-md">
    <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="../index.html" class="p-2 rounded-xl hover:bg-pastel-subtle text-neutral-600 transition">
          <i data-lucide="chevron-left" class="w-5 h-5"></i>
        </a>
        <div class="w-8 h-8 rounded-xl bg-amber-500 flex items-center justify-center text-white shadow-sm shadow-amber-200">
          <i data-lucide="clipboard-check" class="w-4 h-4"></i>
        </div>
        <div>
          <span class="font-bold text-sm tracking-tight text-pastel-text">CAMPORA</span>
          <span class="text-[10px] text-amber-600 block -mt-0.5 font-mono">Management Triage Board</span>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <button id="lockBtn" class="text-xs text-neutral-500 hover:text-rose-600 transition flex items-center gap-1.5">
          <i data-lucide="lock" class="w-3.5 h-3.5"></i> Lock Portal
        </button>
      </div>
    </div>
  </header>

  <!-- Protected Container -->
  <main class="max-w-6xl w-full mx-auto px-6 py-8 space-y-6 flex-1">

    <!-- Passcode Modal (Shown if unauthorized) -->
    <div id="authGate" class="fixed inset-0 modal-backdrop z-50 flex items-center justify-center p-4">
      <div class="bg-white border border-purple-100 rounded-3xl max-w-sm w-full p-6 shadow-2xl text-center">
        <div class="w-12 h-12 mx-auto rounded-2xl bg-amber-50 text-amber-600 flex items-center justify-center mb-4">
          <i data-lucide="shield-alert" class="w-6 h-6"></i>
        </div>
        <h2 class="text-base font-bold text-pastel-text">Resolver Authentication</h2>
        <p class="text-xs text-neutral-500 mt-1">Authorized personnel only (Estate, IT, Wardens).</p>

        <form id="passcodeForm" class="mt-5 space-y-3">
          <input type="password" id="passcodeInput" placeholder="Enter resolver passcode (campora2026)" required
            class="w-full bg-pastel-subtle border border-pastel-border rounded-xl px-3.5 py-2 text-xs text-pastel-text focus:outline-none focus:border-purple-500" />
          <span id="passcodeError" class="text-xs text-rose-500 hidden block">Incorrect key. Try again.</span>

          <button type="submit" class="w-full py-2 bg-purple-600 hover:bg-purple-700 text-white text-xs font-semibold rounded-xl shadow-sm transition">
            Unlock Board
          </button>
        </form>
      </div>
    </div>

    <!-- Triage Table with Filter Tabs -->
    <div class="bg-white border border-pastel-border rounded-3xl p-6 shadow-xs space-y-5">
      <div class="flex items-center justify-between border-b border-purple-50 pb-4">
        <div>
          <h2 class="text-base font-bold text-pastel-text">Incoming Triage Queue</h2>
          <p class="text-xs text-neutral-500 mt-0.5">Tickets prioritised by Urgency Index & Student Endorsements</p>
        </div>
        <button onclick="fetchManagementTickets()" class="p-2 rounded-xl hover:bg-purple-50 text-purple-600 transition" title="Refresh">
          <i data-lucide="refresh-cw" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Status Filter Tabs -->
      <div class="flex flex-wrap items-center gap-2">
        <button data-status="all" class="status-tab px-3.5 py-1.5 rounded-xl border border-purple-300 bg-purple-100/70 text-purple-900 font-semibold text-xs shadow-xs transition-all">
          All
        </button>
        <button data-status="pending" class="status-tab px-3.5 py-1.5 rounded-xl border border-pastel-border bg-white text-neutral-600 hover:border-purple-300 text-xs font-medium transition-all">
          Pending
        </button>
        <button data-status="in_progress" class="status-tab px-3.5 py-1.5 rounded-xl border border-pastel-border bg-white text-neutral-600 hover:border-purple-300 text-xs font-medium transition-all">
          In Progress
        </button>
        <button data-status="resolved" class="status-tab px-3.5 py-1.5 rounded-xl border border-pastel-border bg-white text-neutral-600 hover:border-purple-300 text-xs font-medium transition-all">
          Resolved
        </button>
        <button data-status="rejected" class="status-tab px-3.5 py-1.5 rounded-xl border border-pastel-border bg-white text-neutral-600 hover:border-purple-300 text-xs font-medium transition-all">
          Rejected
        </button>
        <span id="ticketCountBadge" class="ml-auto text-xs font-mono text-neutral-400">Loading...</span>
      </div>

      <div id="ticketsContainer" class="space-y-3"></div>
    </div>
  </main>

  <!-- Resolution Modal -->
  <div id="resolveModal" class="fixed inset-0 modal-backdrop hidden z-50 flex items-center justify-center p-4">
    <div class="bg-white border border-purple-100 rounded-3xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex items-center justify-between pb-3 border-b border-pastel-border">
        <h3 class="text-sm font-bold text-pastel-text flex items-center gap-1.5">
          <i data-lucide="check-square" class="w-4 h-4 text-purple-600"></i>
          <span>Update Resolution Status</span>
        </h3>
        <button id="closeResolveModalBtn" class="text-neutral-400 hover:text-neutral-700 transition">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="resolveForm" class="mt-4 space-y-4">
        <input type="hidden" id="resolveTicketId" />
        <div>
          <span class="text-xs text-neutral-500 block">Updating Ticket:</span>
          <span id="resolveTicketTitle" class="text-xs font-semibold text-pastel-text block mt-0.5 truncate"></span>
        </div>

        <div>
          <label class="block text-xs font-medium text-neutral-700 mb-1">Set Resolution State</label>
          <select id="newStatusSelect" class="w-full bg-pastel-subtle border border-pastel-border rounded-xl px-3 py-2 text-xs text-pastel-text focus:outline-none focus:border-purple-500">
            <option value="IN_PROGRESS">IN_PROGRESS (Technician Assigned)</option>
            <option value="RESOLVED">RESOLVED (Fixed & Verified)</option>
            <option value="REJECTED">REJECTED (Duplicate / Unactionable)</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-medium text-neutral-700 mb-1">Resolution Proof / Action Note</label>
          <textarea id="resolutionNoteInput" rows="3" required placeholder="Detail work done, technician deployed, or reasons..."
            class="w-full bg-pastel-subtle border border-pastel-border rounded-xl px-3 py-2 text-xs text-pastel-text focus:outline-none focus:border-purple-500"></textarea>
        </div>

        <button type="submit" class="w-full py-2 bg-purple-600 hover:bg-purple-700 text-white text-xs font-semibold rounded-xl shadow-sm transition">
          Commit Resolution
        </button>
      </form>
    </div>
  </div>

  <script src="js/management.js"></script>
</body>
</html>
